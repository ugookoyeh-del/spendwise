<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="SpendWise personal expense tracker"><title>SpendWise — Know where it goes</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">PERSONAL FINANCE</p><h1>SpendWise</h1><p class="muted">A clearer picture of your money.</p></div><div class="month" id="monthLabel"></div></header>
<section class="summary"><article><span>Total spent</span><strong id="total">₦0.00</strong></article><article><span>Transactions</span><strong id="count">0</strong></article><article><span>Top category</span><strong id="topCategory">—</strong></article></section>
<section class="panel"><h2>Add an expense</h2><form id="expenseForm"><label>Description<input id="description" required maxlength="70" placeholder="e.g. Lunch"></label><div class="form-row"><label>Amount (₦)<input id="amount" type="number" min="0.01" step="0.01" required placeholder="2500"></label><label>Category<select id="category"><option>Food</option><option>Transport</option><option>Education</option><option>Bills</option><option>Shopping</option><option>Health</option><option>Other</option></select></label></div><button>Add expense</button></form></section>
<section class="panel"><div class="section-head"><h2>Recent expenses</h2><button class="ghost" id="clearAll" type="button">Clear all</button></div><ul id="expenseList" class="expenses"></ul><p id="empty" class="muted">No expenses yet. Add your first one above.</p></section>
<footer>SpendWise · Demo data is stored in this browser only.</footer></main><script src="app.js"></script></body></html>
